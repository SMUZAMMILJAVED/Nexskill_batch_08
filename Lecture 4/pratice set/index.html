<!DOCTYPE html>
<html lang="en">
<head>
    
    <title>Donation <Form></Form></title>
</head>
<body>
    <h1>Donate Now</h1>
    <p><em>Your donation makes a difference. Please fill out the form below to contribute</em>.</p>
    <form action="donation.com.pk" method="get">
        <label for="Full Name">
            Full Name*: <br><input id="Full Name" type="text" name="name" placeholder="please enter your name" required>
        </label> <br><br>

        <label for="Email Address">
            Email Address*:<br><input id="Email Address" type="email" name="email" placeholder="please enter your email" required>

        </label> <br><br>

        <label for="Phone Number">
            Phone Number (Optional): <br><input id="Phone Number" type="number" name="contact number" placeholder="phone number">

        </label> <br><br>

        <label for="Donation Amount">
            Donation Amount*: <br>
            <input id="Donation Amount" type="radio" value="500" name="donation"> 500
            <input id="Donation Amount" type="radio" value="1000" name="donation"> 1000
            <input id="Donation Amount" type="radio" value="2500" name="donation"> 2500
            <input id="Donation Amount" type="radio" value="5000" name="donation"> 5000

        </label><br><br>

        <label for="Other Amount">
            Other Amount: <br><input id="Other Amount" name="donation" type="number">
            
        </label><br><br>

        <label for="Payment Mode">
            Payment Mode: <br>
            <input type="radio" id="Payment Mode" name="Mode of Payment" value="Cash">Cash &nbsp;
            <input type="radio" id="Payment Mode" name="Mode of Payment" value="Card">Card &nbsp;
            <input type="radio" id="Payment Mode" name="Mode of Payment" value="Net Banking">Net Banking&nbsp;
            <input type="radio" id="Payment Mode" name="Mode of Payment" value="Paypal">Paypal

        </label><br><br>

        <label for="Country">
            Country: <br>
            <select name="Country" id="Country">
                <option value="Pak">Pakistan</option>
                <option value="Ind">India</option>
                <option value="Eng">England</option>
                <option value="USA">United States</option>

            </select>

        </label><br><br>


        <label for="Purpose">
            Purpose: <br>
            <input type="checkbox" id="Purpose" name="Medical Support" value="Medical Support">Medical Support &nbsp;
            <input type="checkbox" id="Purpose" name="Education Program" value="Education Program">Education Program &nbsp;
            <input type="checkbox" id="Purpose" name="General Funds" value="General Funds">General Funds&nbsp;
            <input type="checkbox" id="Purpose" name="Others" value="Others">Others

        </label><br><br>

        <label for="Comment">
            Comment: 
            <textarea placeholder="Share your thoughts" name="Comment"></textarea>
        </label><br><br>

        <label for="Payment Proof">
            Submit Your Payment Proof here: <br>
            <input type="file" name="Payment Proof">

        </label> <br><br>

         <label for="URL">
        Please Enter Your Profile URL:
        <input type="url" name="url" id="URL">
    </label><br><br>

        <label for="Submit">
            Click here to Submit Form:
            <button>Submit</button>

        </label>




    </form>
    

    <img src="" alt="" >
</body>
</html>

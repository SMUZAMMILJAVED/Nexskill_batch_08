<!DOCTYPE html>
<html lang="en">
<head>
    
    <title>Donation <Form></Form></title>
</head>
<body>
    <h1>Donate Now</h1>
    <p>Your donation makes a difference. Please fill out the form below to contribute.</p>
    <form action="donation.com.pk">
        <label for="Full Name">
            Full Name*: <br><input id="Full Name" type="text" name="name" placeholder="please enter your name" required>
        </label> <br><br>

        <label for="Email Address">
            Email Address*:<br><input id="Email Address" type="text" name="email" placeholder="please enter your email" required>

        </label> <br><br>

        <label for="Phone Number">
            Phone Number (Optional): <br><input id="Phone Number" type="number" name="contact number" placeholder="phone number">

        </label> <br><br>

        <label for="Donation Amount">
            Donation Amount*: <br>
            <input id="Donation Amount" type="radio" value="500" name="donation"> 500
            <input id="Donation Amount" type="radio" value="1000" name="donation"> 1000
            <input id="Donation Amount" type="radio" value="2500" name="donation"> 2500
            <input id="Donation Amount" type="radio" value="5000" name="donation"> 5000

        </label>

        <label for="Other Amount"></label>








    </form>
    
</body>
</html>
